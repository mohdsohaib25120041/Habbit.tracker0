<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.supabase.co; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>GoalForce Admin</title>
<style>
:root { color-scheme: dark; --bg:#07080b; --card:#12141a; --line:rgba(255,255,255,.09); --text:#fff; --muted:#9a9fac; --cyan:#00f0ff; --green:#00ff88; --yellow:#ffcc00; --red:#ff3366; --purple:#b026ff; }
@media (prefers-color-scheme: light) { :root:not([data-t="dark"]) { color-scheme: light; --bg:#f4f5f7; --card:#fff; --line:rgba(0,0,0,.1); --text:#111; --muted:#5f6573; --cyan:#0097a7; --green:#00805a; --yellow:#8a6500; --red:#d01c4a; --purple:#8e24aa; } }
* { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); min-height: 100vh; padding-top: env(safe-area-inset-top); }
button, input, select, textarea { font: inherit; color: inherit; }
h1 { font-size: 22px; } h2 { font-size: 18px; margin-bottom: 14px; } h3 { font-size: 15px; }
.muted { color: var(--muted); font-size: 13px; }
.btn { background: rgba(0,240,255,.1); color: var(--cyan); border: 1px solid var(--cyan); padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 13px; }
.btn:hover { background: var(--cyan); color: #000; }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--muted); }
.btn.danger { background: transparent; color: var(--red); border-color: var(--red); }
.btn.danger:hover { background: var(--red); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }
input, select, textarea { width: 100%; padding: 10px 12px; border-radius: 10px; background: rgba(128,128,128,.12); border: 1px solid var(--line); outline: none; font-size: 14px; }
input:focus, select:focus, textarea:focus { border-color: var(--cyan); }
label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 5px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 16px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.nav { display: flex; gap: 6px; padding: 12px 20px 0; overflow-x: auto; }
.nav button { background: transparent; border: 1px solid var(--line); color: var(--muted); padding: 8px 14px; border-radius: 10px; cursor: pointer; white-space: nowrap; font-size: 13px; font-weight: 600; }
.nav button.on { color: var(--cyan); border-color: var(--cyan); background: rgba(0,240,255,.1); }
main { padding: 16px 20px 60px; max-width: 1100px; margin: 0 auto; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.stat .l { font-size: 12px; color: var(--muted); } .stat .v { font-size: 26px; font-weight: 700; margin-top: 4px; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 760px; }
th { text-align: left; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; word-break: break-word; }
.tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; border: 1px solid currentColor; white-space: nowrap; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.bars { display: flex; align-items: flex-end; gap: 3px; height: 120px; }
.bars div { flex: 1; background: var(--cyan); border-radius: 3px 3px 0 0; min-height: 2px; opacity: .85; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.overlay.show { display: flex; }
.modal { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px; width: 100%; max-width: 440px; max-height: 90vh; overflow-y: auto; }
.toast { position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); background: var(--card); border: 1px solid var(--cyan); padding: 10px 18px; border-radius: 30px; z-index: 99; font-size: 14px; max-width: 92vw; }
.toast.err { border-color: var(--red); color: var(--red); }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px; }
.checks label { display: flex; align-items: center; gap: 6px; margin: 0; color: var(--text); font-size: 13px; }
.checks input { width: auto; }
#login { max-width: 380px; margin: 12vh auto 0; padding: 0 16px; }
.hidden { display: none !important; }
a { color: var(--cyan); }
</style>
</head>
<body>

<div id="login" class="hidden">
  <div class="card">
    <h1>GoalForce Admin</h1>
    <div class="muted" style="margin-top: 6px;">Only people added as admins can enter.</div>
    <label for="lEmail">Email</label><input type="email" id="lEmail" autocomplete="email">
    <label for="lPass">Password</label><input type="password" id="lPass" autocomplete="current-password" onkeydown="if (event.key === 'Enter') doLogin()">
    <div id="lMsg" class="muted" style="color: var(--red); min-height: 20px; margin: 10px 0;" aria-live="polite"></div>
    <button class="btn" style="width: 100%; padding: 11px;" onclick="doLogin()">Log in</button>
    <div class="muted" style="margin-top: 14px;"><a href="index.html">Back to the app</a></div>
  </div>
</div>

<div id="app" class="hidden">
  <div class="top"><div><h1>GoalForce Admin</h1><div class="muted" id="who"></div></div><div class="row"><a class="btn ghost" href="index.html" style="text-decoration: none;">Open app</a><button class="btn ghost" onclick="logout()">Log out</button></div></div>
  <div class="nav" id="nav"></div>
  <main id="view"></main>
</div>

<div class="overlay" id="ov" onclick="if (event.target === this) closeModal()"><div class="modal" id="modal"></div></div>
<div id="toastBox"></div>

<script src="config.js"></script>
<script>
const CFG = Object.assign({ url: '', key: '' }, window.GOALFORCE_CONFIG || {});
const READY = /^(https:\/\/|http:\/\/localhost)/.test(CFG.url) && CFG.key.length > 20;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const THEME_IDS = ['dark', 'light', 'ocean', 'forest', 'sunset', 'royal', 'rose', 'cyber', 'gold', 'aurora', 'legend', 'vintage'];
let session = null, tab = 'dashboard', usersState = { q: '', page: 0, total: 0, rows: [] };
const PAGE = 25;

function toast(msg, bad) { const t = document.createElement('div'); t.className = 'toast' + (bad ? ' err' : ''); t.textContent = msg; $('toastBox').appendChild(t); setTimeout(() => t.remove(), 3500); }
function openModal(html) { $('modal').innerHTML = html; $('ov').classList.add('show'); }
function closeModal() { $('ov').classList.remove('show'); }
const fdate = d => d ? new Date(d).toLocaleDateString() : '-';
const fdt = d => d ? new Date(d).toLocaleString() : '-';
const ago = d => { if (!d) return 'never'; const s = (Date.now() - new Date(d)) / 1000; return s < 3600 ? Math.max(1, Math.round(s / 60)) + ' min ago' : s < 86400 ? Math.round(s / 3600) + ' h ago' : Math.round(s / 86400) + ' d ago'; };

// ---------- API (Supabase REST, no library) ----------
function save(s) { session = s; try { s ? localStorage.setItem('quantumAdminAuth', JSON.stringify(s)) : localStorage.removeItem('quantumAdminAuth'); } catch (e) {} }
function msgOf(status, data) {
  const raw = String((data && (data.msg || data.error_description || data.message || data.error)) || '').toLowerCase();
  if (raw.includes('invalid login')) return 'Wrong email or password.';
  if (raw.includes('not confirmed')) return 'Please confirm your email first.';
  if (status === 429) return 'Too many tries. Wait a minute.';
  if (raw.includes('not allowed') || (data && data.code === '42501')) return 'You are not allowed to do this.';
  if (status === 404 || raw.includes('could not find the function')) return 'The admin database part is not installed yet. Run 2_admin_setup.sql (or RUN_THIS_SQL.sql).';
  if (status === 401) return 'Your login expired. Please log in again.';
  if (status >= 500) return 'Server problem. Try again later.';
  return (data && data.message) ? String(data.message).slice(0, 140) : 'Something went wrong.';
}
async function api(path, o) {
  o = o || {};
  if (session && o.token === undefined && session.exp - Date.now() / 1000 < 60) await refresh();
  const tok = o.token === undefined ? (session && session.access) : o.token;
  const h = { apikey: CFG.key, 'Content-Type': 'application/json' };
  if (tok) h.Authorization = 'Bearer ' + tok; else if (CFG.key.startsWith('eyJ')) h.Authorization = 'Bearer ' + CFG.key;
  let res;
  try { res = await fetch(CFG.url + path, { method: o.method || 'GET', headers: h, cache: 'no-store', body: o.body !== undefined ? JSON.stringify(o.body) : undefined }); }
  catch (e) { throw { message: 'No internet connection.' }; }
  const txt = await res.text(); let data = null; try { data = txt ? JSON.parse(txt) : null; } catch (e) { data = txt; }
  if (res.status === 401 && o.token === undefined && session && !o.retried && await refresh()) return api(path, Object.assign({}, o, { retried: true }));
  if (!res.ok) throw { status: res.status, data, message: msgOf(res.status, data) };
  return data;
}
const rpc = (name, args) => api('/rest/v1/rpc/' + name, { method: 'POST', body: args || {} });
function setTokens(r) { save({ access: r.access_token, refresh: r.refresh_token || (session && session.refresh), exp: r.expires_at || Math.floor(Date.now() / 1000) + (r.expires_in || 3600), email: r.user ? r.user.email : (session && session.email) }); }
let refreshing = null;
function refresh() {
  if (refreshing) return refreshing;
  refreshing = (async () => {
    try { setTokens(await api('/auth/v1/token?grant_type=refresh_token', { method: 'POST', body: { refresh_token: session.refresh }, token: null })); return true; }
    catch (e) { if (e.status >= 400 && e.status < 500) { save(null); showLogin(); } return false; }
    finally { refreshing = null; }
  })();
  return refreshing;
}

// ---------- login ----------
function showLogin(msg) { $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('lMsg').textContent = msg || ''; }
async function doLogin() {
  const email = $('lEmail').value.trim().toLowerCase(), pass = $('lPass').value;
  if (!email || !pass) { $('lMsg').textContent = 'Enter email and password.'; return; }
  $('lMsg').textContent = 'Please wait...';
  try {
    setTokens(await api('/auth/v1/token?grant_type=password', { method: 'POST', body: { email, password: pass }, token: null }));
    $('lPass').value = ''; await enter();
  } catch (e) { $('lMsg').textContent = e.message; }
}
async function enter() {
  try {
    const ok = await rpc('is_admin');
    if (ok !== true) { await logout('This account is not an admin.'); return; }
  } catch (e) { await logout(e.message); return; }
  $('login').classList.add('hidden'); $('app').classList.remove('hidden'); $('who').textContent = 'Logged in as ' + (session.email || '');
  renderNav(); go('dashboard');
}
async function logout(msg) {
  if (session) { try { await api('/auth/v1/logout', { method: 'POST' }); } catch (e) {} }
  save(null); showLogin(typeof msg === 'string' ? msg : '');
}

// ---------- navigation ----------
const TABS = [['dashboard', 'Dashboard'], ['users', 'Users'], ['announcements', 'Announcements'], ['settings', 'App settings'], ['codes', 'Premium codes'], ['feedback', 'Feedback'], ['log', 'Audit log']];
function renderNav() { $('nav').innerHTML = TABS.map(([k, l]) => `<button class="${tab === k ? 'on' : ''}" onclick="go('${k}')">${l}</button>`).join(''); }
async function go(t) {
  tab = t; renderNav(); $('view').innerHTML = '<div class="muted">Loading...</div>';
  try { await ({ dashboard: vDashboard, users: vUsers, announcements: vAnn, settings: vSettings, codes: vCodes, feedback: vFeedback, log: vLog }[t])(); }
  catch (e) { $('view').innerHTML = `<div class="card" style="color: var(--red);">${esc(e.message || 'Something went wrong.')}</div>`; }
}

// ---------- dashboard ----------
async function vDashboard() {
  const s = await rpc('admin_stats'), days = s.signups_by_day || [], max = Math.max(1, ...days.map(d => d.n));
  const st = [['Total users', s.total_users], ['New (7 days)', s.new_7d], ['New (30 days)', s.new_30d], ['Active (7 days)', s.active_7d], ['Active (30 days)', s.active_30d], ['Premium now', s.premium_active], ['Suspended', s.banned], ['With cloud backup', s.synced_users], ['New feedback', s.feedback_new]];
  $('view').innerHTML = `<div class="grid">${st.map(([l, v]) => `<div class="stat"><div class="l">${l}</div><div class="v">${Number(v) || 0}</div></div>`).join('')}</div>
    <div class="card"><h2>New sign-ups, last 30 days</h2><div class="bars">${days.map(d => `<div title="${esc(d.day)}: ${d.n}" style="height: ${Math.round(d.n / max * 100)}%"></div>`).join('')}</div><div class="muted" style="margin-top: 8px;">${esc((days[0] || {}).day || '')} to ${esc((days[days.length - 1] || {}).day || '')}</div></div>
    <div class="card"><h2>Money and ads</h2><div class="muted" style="line-height: 1.7;">Ad earnings (AdMob) and Google Play sales are not stored in this database. See them in the official dashboards:<br>
      <a href="https://admob.google.com" target="_blank" rel="noopener">AdMob</a> &middot; <a href="https://play.google.com/console" target="_blank" rel="noopener">Google Play Console</a> &middot; <a href="https://supabase.com/dashboard" target="_blank" rel="noopener">Supabase</a></div></div>`;
}

// ---------- users ----------
async function loadUsers() { const r = await rpc('admin_users', { q: usersState.q, lim: PAGE, off: usersState.page * PAGE }); usersState.total = r.total; usersState.rows = r.rows; }
async function vUsers() { await loadUsers(); drawUsers(true); }
function drawUsers(full) {
  const u = usersState, pages = Math.max(1, Math.ceil(u.total / PAGE));
  const rows = u.rows.map((r, i) => `<tr>
    <td>${esc(r.email)}${r.note ? `<div class="muted">${esc(r.note)}</div>` : ''}</td><td>${fdate(r.created_at)}</td><td>${ago(r.last_seen)}</td>
    <td>${r.plan === 'premium' ? `<span class="tag" style="color: var(--yellow);">PREMIUM</span><div class="muted">until ${fdate(r.premium_until)}</div>` : '<span class="muted">Free</span>'}</td>
    <td>${Number(r.habits) || 0} / ${Number(r.xp) || 0}</td><td>${r.banned ? '<span class="tag" style="color: var(--red);">SUSPENDED</span>' : '<span class="tag" style="color: var(--green);">OK</span>'}</td>
    <td><div class="row"><button class="btn" onclick="premiumModal(${i})">Premium</button><button class="btn ${r.banned ? '' : 'danger'}" onclick="toggleBan(${i})">${r.banned ? 'Unsuspend' : 'Suspend'}</button><button class="btn ghost" onclick="noteModal(${i})">Note</button></div></td></tr>`).join('');
  const table = `<div class="tablewrap"><table><thead><tr><th>Email</th><th>Joined</th><th>Last seen</th><th>Plan</th><th>Habits / XP</th><th>Status</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan="7" class="muted">No users found.</td></tr>'}</tbody></table></div>
    <div class="row" style="margin-top: 12px; justify-content: space-between;"><span class="muted">${u.total} user${u.total === 1 ? '' : 's'} - page ${u.page + 1} of ${pages}</span><div class="row"><button class="btn ghost" ${u.page === 0 ? 'disabled' : ''} onclick="usersPage(-1)">Previous</button><button class="btn ghost" ${u.page + 1 >= pages ? 'disabled' : ''} onclick="usersPage(1)">Next</button></div></div>`;
  if (full) {
    $('view').innerHTML = `<div class="card"><div class="row" style="justify-content: space-between; margin-bottom: 12px;"><h2 style="margin: 0;">Users</h2><button class="btn" onclick="exportUsers()">Export CSV</button></div>
      <div class="row" style="margin-bottom: 14px;"><input id="uq" placeholder="Search by email" value="${esc(u.q)}" style="max-width: 320px;" onkeydown="if (event.key === 'Enter') usersSearch()"><button class="btn" onclick="usersSearch()">Search</button></div><div id="utable">${table}</div></div>`;
  } else $('utable').innerHTML = table;
}
async function usersSearch() { usersState.q = $('uq').value.trim(); usersState.page = 0; await loadUsers(); drawUsers(false); }
async function usersPage(d) { usersState.page = Math.max(0, usersState.page + d); await loadUsers(); drawUsers(false); }
const U = i => usersState.rows[i];
function premiumModal(i) {
  const r = U(i);
  openModal(`<h2>Premium for ${esc(r.email)}</h2><div class="muted" style="margin-bottom: 12px;">Now: ${r.plan === 'premium' ? 'Premium until ' + fdate(r.premium_until) : 'Free'}</div>
    <div class="row"><button class="btn" onclick="givePremium(${i}, 30)">+30 days</button><button class="btn" onclick="givePremium(${i}, 90)">+90 days</button><button class="btn" onclick="givePremium(${i}, 365)">+1 year</button></div>
    <label for="pDate">Or choose an end date</label><input type="date" id="pDate"><div class="row" style="margin-top: 14px;"><button class="btn" onclick="setPremiumDate(${i})">Set date</button><button class="btn danger" onclick="removePremium(${i})">Remove premium</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`);
}
async function setPremium(i, until, okMsg) {
  try { await rpc('admin_set_premium', { target: U(i).user_id, until }); closeModal(); toast(okMsg); await loadUsers(); drawUsers(false); } catch (e) { toast(e.message, true); }
}
function givePremium(i, days) { const r = U(i), base = r.premium_until && new Date(r.premium_until) > new Date() ? new Date(r.premium_until) : new Date(); base.setDate(base.getDate() + days); return setPremium(i, base.toISOString(), 'Premium updated'); }
function setPremiumDate(i) { const v = $('pDate').value; if (!v) return toast('Pick a date first.', true); return setPremium(i, new Date(v + 'T23:59:59Z').toISOString(), 'Premium updated'); }
function removePremium(i) { return setPremium(i, null, 'Premium removed'); }
async function toggleBan(i) {
  const r = U(i), flag = !r.banned;
  if (flag && !confirm('Suspend ' + r.email + '? They can still use the app on their device, but cloud backup stops.')) return;
  try { await rpc('admin_set_banned', { target: r.user_id, flag }); toast(flag ? 'User suspended' : 'User unsuspended'); await loadUsers(); drawUsers(false); } catch (e) { toast(e.message, true); }
}
function noteModal(i) { const r = U(i); openModal(`<h2>Note for ${esc(r.email)}</h2><label for="nTxt">Private note (only admins see it)</label><textarea id="nTxt" rows="3" maxlength="500">${esc(r.note || '')}</textarea><div class="row" style="margin-top: 14px;"><button class="btn" onclick="saveNote(${i})">Save</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`); }
async function saveNote(i) { try { await rpc('admin_set_note', { target: U(i).user_id, txt: $('nTxt').value }); closeModal(); toast('Note saved'); await loadUsers(); drawUsers(false); } catch (e) { toast(e.message, true); } }
const csvCell = v => { let s = String(v == null ? '' : v); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
async function exportUsers() {
  try {
    let off = 0, all = [], total = 1;
    while (off < total && off < 20000) { const r = await rpc('admin_users', { q: usersState.q, lim: 1000, off }); total = r.total; all = all.concat(r.rows); if (!r.rows.length) break; off += 1000; }
    const head = ['email', 'joined', 'last_seen', 'plan', 'premium_until', 'suspended', 'habits', 'xp', 'last_backup'];
    const lines = [head.join(',')].concat(all.map(r => [r.email, r.created_at, r.last_seen, r.plan, r.premium_until, r.banned, r.habits, r.xp, r.synced_at].map(csvCell).join(',')));
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv' })); a.download = 'goalforce-users-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); toast('Exported ' + all.length + ' users');
  } catch (e) { toast(e.message, true); }
}

// ---------- announcements ----------
let annCache = [];
async function vAnn() {
  annCache = await rpc('admin_announcements');
  const rows = annCache.map((a, i) => `<tr><td><b>${esc(a.title)}</b><div class="muted">${esc(a.body)}</div></td><td>${a.active ? '<span class="tag" style="color: var(--green);">ACTIVE</span>' : '<span class="tag muted">OFF</span>'}</td><td>${a.expires_at ? fdate(a.expires_at) : 'No end'}</td><td><div class="row"><button class="btn" onclick="annModal(${i})">Edit</button><button class="btn danger" onclick="annDelete(${i})">Delete</button></div></td></tr>`).join('');
  $('view').innerHTML = `<div class="card"><div class="row" style="justify-content: space-between; margin-bottom: 12px;"><h2 style="margin: 0;">Announcements</h2><button class="btn" onclick="annModal(-1)">New announcement</button></div><div class="muted" style="margin-bottom: 10px;">Active announcements appear on every user's home screen until they dismiss them.</div><div class="tablewrap"><table><thead><tr><th>Message</th><th>Status</th><th>Ends</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan="4" class="muted">No announcements yet.</td></tr>'}</tbody></table></div></div>`;
}
function annModal(i) {
  const a = i >= 0 ? annCache[i] : { title: '', body: '', active: true, expires_at: null };
  openModal(`<h2>${i >= 0 ? 'Edit' : 'New'} announcement</h2><label for="aT">Title</label><input id="aT" maxlength="120" value="${esc(a.title)}"><label for="aB">Message</label><textarea id="aB" rows="3" maxlength="1000">${esc(a.body)}</textarea>
    <label for="aE">Ends on (optional)</label><input type="date" id="aE" value="${a.expires_at ? esc(String(a.expires_at).slice(0, 10)) : ''}">
    <label style="display: flex; gap: 8px; align-items: center; color: var(--text);"><input type="checkbox" id="aA" style="width: auto;" ${a.active ? 'checked' : ''}> Show to users</label>
    <div class="row" style="margin-top: 14px;"><button class="btn" onclick="annSave(${i})">Save</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`);
}
async function annSave(i) {
  const t = $('aT').value.trim(); if (!t) return toast('Write a title.', true);
  const e = $('aE').value;
  try { await rpc('admin_save_announcement', { a_id: i >= 0 ? annCache[i].id : null, a_title: t, a_body: $('aB').value.trim(), a_active: $('aA').checked, a_expires: e ? new Date(e + 'T23:59:59Z').toISOString() : null }); closeModal(); toast('Saved'); vAnn(); } catch (er) { toast(er.message, true); }
}
async function annDelete(i) { if (!confirm('Delete this announcement?')) return; try { await rpc('admin_delete_announcement', { a_id: annCache[i].id }); toast('Deleted'); vAnn(); } catch (e) { toast(e.message, true); } }

// ---------- app settings ----------
async function vSettings() {
  const s = await rpc('admin_get_settings'), m = s.maintenance || {}, locked = Array.isArray(s.premium_themes) ? s.premium_themes : [];
  $('view').innerHTML = `<div class="card"><h2>App settings</h2>
    <label style="display: flex; gap: 8px; align-items: center; color: var(--text);"><input type="checkbox" id="sM" style="width: auto;" ${m.on ? 'checked' : ''}> Maintenance notice (shows a banner to everyone)</label>
    <label for="sMm">Maintenance message</label><input id="sMm" maxlength="200" value="${esc(m.message || '')}">
    <label style="display: flex; gap: 8px; align-items: center; color: var(--text);"><input type="checkbox" id="sAd" style="width: auto;" ${s.ads_enabled === false ? '' : 'checked'}> Ads allowed for free users (used by the Android app)</label>
    <label>Premium-only themes (everyone else sees an upgrade message; none ticked = all themes free)</label><div class="checks">${THEME_IDS.map(t => `<label><input type="checkbox" class="pt" value="${t}" ${locked.includes(t) ? 'checked' : ''}> ${t}</label>`).join('')}</div>
    <label for="sU">Text shown on the "Go Premium" screen</label><textarea id="sU" rows="3" maxlength="400">${esc(typeof s.upgrade_text === 'string' ? s.upgrade_text : '')}</textarea>
    <label for="sE">Support email shown to users</label><input id="sE" type="email" maxlength="120" value="${esc(typeof s.support_email === 'string' ? s.support_email : '')}">
    <div class="row" style="margin-top: 16px;"><button class="btn" onclick="saveSettings()">Save settings</button></div></div>`;
}
async function saveSettings() {
  const themes = [...document.querySelectorAll('.pt:checked')].map(x => x.value);
  try {
    await rpc('admin_set_setting', { k: 'maintenance', v: { on: $('sM').checked, message: $('sMm').value.trim() } });
    await rpc('admin_set_setting', { k: 'ads_enabled', v: $('sAd').checked });
    await rpc('admin_set_setting', { k: 'premium_themes', v: themes });
    await rpc('admin_set_setting', { k: 'upgrade_text', v: $('sU').value.trim() });
    await rpc('admin_set_setting', { k: 'support_email', v: $('sE').value.trim() });
    toast('Settings saved. Users see them the next time the app opens.');
  } catch (e) { toast(e.message, true); }
}

// ---------- premium codes ----------
let codeCache = [];
async function vCodes() {
  codeCache = await rpc('admin_codes', { lim: 200 });
  const rows = codeCache.map((c, i) => `<tr><td><code style="font-size: 14px; letter-spacing: 1px;">${esc(c.code)}</code></td><td>${Number(c.days)} days</td><td>${Number(c.used_count)} / ${Number(c.max_uses)}</td><td>${c.expires_at ? fdate(c.expires_at) : 'No end'}</td><td class="muted">${esc(c.note || '')}</td><td><button class="btn danger" onclick="codeDelete(${i})">Delete</button></td></tr>`).join('');
  $('view').innerHTML = `<div class="card"><h2>Create Premium codes</h2><div class="muted" style="margin-bottom: 8px;">Give or sell a code. The user enters it in the app (Settings, or the Go Premium screen) and gets Premium for that many days.</div>
    <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); margin: 0;">
      <div><label for="cN">How many codes</label><input type="number" id="cN" min="1" max="200" value="5"></div>
      <div><label for="cD">Days of Premium</label><input type="number" id="cD" min="1" max="3650" value="30"></div>
      <div><label for="cM">Uses per code</label><input type="number" id="cM" min="1" max="10000" value="1"></div>
      <div><label for="cE">Code ends on (optional)</label><input type="date" id="cE"></div></div>
    <label for="cT">Note for yourself (optional)</label><input id="cT" maxlength="200" placeholder="e.g. Diwali offer, sold on WhatsApp"><div class="row" style="margin-top: 14px;"><button class="btn" onclick="codesCreate()">Create codes</button></div></div>
    <div class="card"><h2>Your codes</h2><div class="tablewrap"><table><thead><tr><th>Code</th><th>Gives</th><th>Used</th><th>Ends</th><th>Note</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan="6" class="muted">No codes yet.</td></tr>'}</tbody></table></div></div>`;
}
async function codesCreate() {
  const n = parseInt($('cN').value, 10), d = parseInt($('cD').value, 10), m = parseInt($('cM').value, 10), e = $('cE').value;
  if (!(n >= 1 && n <= 200 && d >= 1 && d <= 3650 && m >= 1)) return toast('Check the numbers.', true);
  try {
    const made = await rpc('admin_create_codes', { n, d, m, ex: e ? new Date(e + 'T23:59:59Z').toISOString() : null, nt: $('cT').value.trim() });
    openModal(`<h2>${made.length} code${made.length === 1 ? '' : 's'} created</h2><div class="muted" style="margin-bottom: 8px;">Copy them now. Each gives ${d} days of Premium.</div><textarea id="cOut" rows="8" readonly style="font-family: monospace;">${esc(made.join('\n'))}</textarea><div class="row" style="margin-top: 14px;"><button class="btn" onclick="copyCodes()">Copy</button><button class="btn ghost" onclick="closeModal(); vCodes()">Close</button></div>`);
  } catch (er) { toast(er.message, true); }
}
function copyCodes() { const t = $('cOut'); t.select(); try { navigator.clipboard.writeText(t.value).then(() => toast('Copied')); } catch (e) { document.execCommand('copy'); toast('Copied'); } }
async function codeDelete(i) { if (!confirm('Delete code ' + codeCache[i].code + '?')) return; try { await rpc('admin_delete_code', { c: codeCache[i].code }); toast('Deleted'); vCodes(); } catch (e) { toast(e.message, true); } }

// ---------- feedback + audit log ----------
async function vFeedback() {
  const list = await rpc('admin_feedback', { lim: 100 });
  const rows = list.map((f, i) => `<tr><td>${fdt(f.created_at)}</td><td>${esc(f.email || 'deleted user')}</td><td><span class="tag">${esc(f.kind)}</span></td><td style="white-space: pre-wrap;">${esc(f.message)}</td><td>${f.status === 'new' ? `<button class="btn" onclick="fbDone('${esc(f.id)}')">Mark done</button>` : '<span class="muted">done</span>'}</td></tr>`).join('');
  $('view').innerHTML = `<div class="card"><h2>User feedback</h2><div class="tablewrap"><table><thead><tr><th>When</th><th>From</th><th>Type</th><th>Message</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan="5" class="muted">No feedback yet.</td></tr>'}</tbody></table></div></div>`;
}
async function fbDone(id) { try { await rpc('admin_feedback_status', { f_id: id, new_status: 'done' }); vFeedback(); } catch (e) { toast(e.message, true); } }
async function vLog() {
  const list = await rpc('admin_log_list', { lim: 100 });
  const rows = list.map(l => `<tr><td>${fdt(l.created_at)}</td><td>${esc(l.admin_email || '-')}</td><td><span class="tag">${esc(l.action)}</span></td><td>${esc(l.target_email || '')}</td><td class="muted">${esc(l.detail ? JSON.stringify(l.detail) : '')}</td></tr>`).join('');
  $('view').innerHTML = `<div class="card"><h2>Audit log (what admins changed)</h2><div class="tablewrap"><table><thead><tr><th>When</th><th>Admin</th><th>Action</th><th>User</th><th>Details</th></tr></thead><tbody>${rows || '<tr><td colspan="5" class="muted">Nothing yet.</td></tr>'}</tbody></table></div></div>`;
}

// ---------- start ----------
(async function () {
  if (!READY) { showLogin('Not set up yet: fill in config.js with your Supabase URL and key.'); return; }
  try { session = JSON.parse(localStorage.getItem('quantumAdminAuth') || 'null'); } catch (e) { session = null; }
  if (session && session.access) await enter(); else showLogin();
})();
</script>
</body>
</html>
